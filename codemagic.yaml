workflows:
  android-build:
    name: Build APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
